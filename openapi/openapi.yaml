components:
  securitySchemes:
    V1Bearer:
      type: http
      scheme: bearer
      description: >-
        Merchant API key (raw bearer) or OAuth access token (frmat_ prefix).
        One header serves both families; the credential decides merchant_id
        and scopes server-side. Current API version 2026-01-01.
    CronBearer:
      type: http
      scheme: bearer
      description: >-
        Scheduler credential: BILLING_CRON_SECRET (constant-time compare,
        preferred) or a token registered in ops_cron_secrets. Required on
        every POST to /api/public/cron/*.
    MetricsBearer:
      type: http
      scheme: bearer
      description: "METRICS_TOKEN deployment secret for the Prometheus scrape target."
    ErrorAlertSecret:
      type: apiKey
      in: header
      name: x-error-alert-secret
      description: >-
        ERROR_ALERT_SECRET shared secret; also accepted as an Authorization
        Bearer value. Absent secret ⇒ endpoint 404s.
    EdgeSignature:
      type: apiKey
      in: header
      name: framique-edge-signature
      description: >-
        HMAC-SHA256 over '<unix-seconds>.<raw-body>' under DOMAIN_EDGE_TOKEN
        (t=<ts>,v1=<hex>, 300 s skew window).
    NewsletterSignature:
      type: apiKey
      in: header
      name: x-framique-signature
      description: >-
        Lowercase HMAC-SHA256 hex of '<timestamp>.<raw-body>' under
        NEWSLETTER_WEBHOOK_SECRET, paired with the x-framique-timestamp
        header (300 s replay window).
    GatewaySignature:
      type: apiKey
      in: header
      name: x-webhook-signature
      description: "Provider signature verified by the payment gateway layer before any write."
    CourierSignature:
      type: apiKey
      in: header
      name: x-framique-signature
      description: >-
        HMAC verified against the merchant's stored carrier secret; also
        accepted via x-courier-signature or x-hub-signature-256.
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
      description: "Page size (clamped server-side)."
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: "Opaque keyset cursor over (created_at, id)."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: "Required on every non-GET v1 call; same key + different body ⇒ 409."
    CronLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: "Batch size for this tick (each job applies its own default and clamp)."
    CronTrigger:
      name: trigger
      in: query
      required: false
      schema:
        type: string
        enum:
          - manual
          - schedule
      description: "Ledger trigger label; anything but 'manual' is recorded as 'schedule'."
    PlatformReturnQuery:
      name: charge
      in: query
      required: true
      schema:
        type: string
      description: "Platform charge id (companions status, sig, failure ride in the same query string)."
  responses:
    V1Problem:
      description: "RFC 9457-style problem response (application/problem+json)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CronRun:
      description: "'{ ok: true, job, durationMs, slow, result }' on success, or '{ skipped: true, reason }' for deliberate no-ops."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CronRunResult"
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    OAuthTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
        client_id:
          type: string
        client_secret:
          type: string
        code:
          type: string
        redirect_uri:
          type: string
        code_verifier:
          type: string
        refresh_token:
          type: string
      required:
        - grant_type
        - client_id
    TokenPair:
      type: object
      description: "OAuth access + rotating refresh pair (exact fields owned by @/lib/oauth.server)."
      additionalProperties: true
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
    AdClick:
      type: object
      required:
        - merchantId
        - network
        - visitorId
        - nonce
        - sentAt
      properties:
        merchantId:
          type: string
          format: uuid
        network:
          type: string
          maxLength: 20
        campaign:
          type: string
        adset:
          type: string
        creative:
          type: string
        clickId:
          type: string
        landingPath:
          type: string
        referrerHost:
          type: string
        javascriptRan:
          type: boolean
          default: true
        automationHints:
          type: integer
        dwellMs:
          type: integer
        interactions:
          type: integer
        timezoneOffsetMinutes:
          type: integer
        visitorId:
          type: string
        nonce:
          type: string
          minLength: 16
          maxLength: 64
        sentAt:
          type: integer
        signature:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "Optional HMAC-SHA256 hex; mandatory when the merchant configured a beacon secret."
    BeaconBatch:
      type: object
      required:
        - merchantId
        - events
      properties:
        merchantId:
          type: string
          format: uuid
        visitorId:
          type: string
        sessionId:
          type: string
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required:
              - entity
              - action
            properties:
              entity:
                type: string
                enum:
                  - page
                  - product
                  - cart
                  - checkout
                  - order
                  - search
              action:
                type: string
                maxLength: 40
              occurredAt:
                type: string
                format: date-time
              source:
                type: string
              campaign:
                type: string
              valueMinorInt:
                type: integer
              currencyCode:
                type: string
              payload:
                type: object
                additionalProperties: true
              dedupeKey:
                type: string
    VitalsBatch:
      type: object
      required:
        - merchantId
        - samples
      properties:
        merchantId:
          type: string
          format: uuid
        samples:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required:
              - metric
              - value
            properties:
              metric:
                type: string
                enum:
                  - lcp
                  - inp
                  - cls
                  - ttfb
                  - fcp
              value:
                type: number
                minimum: 0
              template:
                type: string
              path:
                type: string
              locale:
                type: string
                enum:
                  - en
                  - bn
              device:
                type: string
                enum:
                  - mobile
                  - tablet
                  - desktop
                  - unknown
              connection:
                type: string
              ts:
                type: number
    BrowserError:
      type: object
      required:
        - message
        - mechanism
      properties:
        message:
          type: string
          maxLength: 500
        stack:
          type: string
        mechanism:
          type: string
          enum:
            - onerror
            - unhandledrejection
