openapi: 3.1.0
info:
  title: Framique Public & Scheduled HTTP API
  version: 2026-01-01
  description: >-
    Machine-readable inventory of every reachable endpoint under
    src/routes/api (public storefront/telemetry/webhook surface, the
    versioned v1 REST gateway, bearer-guarded scheduled cron endpoints, and
    the admin server-function module). Reverse-engineered from the TanStack
    Start route handlers; anything not verifiable in code is flagged with
    x-undocumented: true instead of invented. See openapi/AUDIT.md for the
    conformance verdict and gap analysis.
  contact:
    name: Platform
  license:
    name: Proprietary
servers:
  - url: https://framique.store
    description: "Production storefront origin"
  - url: http://localhost:5173
    description: "Local development"
tags:
  - name: oauth
    description: "OAuth 2.1 token issuance and revocation (RFC 6749 / RFC 7009)."
  - name: v1
    description: "Versioned merchant REST gateway (API key or OAuth bearer + scopes)."
  - name: cron
    description: "Bearer-guarded scheduled jobs (BILLING_CRON_SECRET or registered scheduler token)."
  - name: telemetry
    description: "Anonymous storefront telemetry collectors (rate limited, hostile-input hardened)."
  - name: webhooks
    description: "Inbound provider/carrier/edge webhooks (HMAC verified)."
  - name: edge
    description: "Edge delivery endpoints (media, fonts, images, placeholders, TLS)."
  - name: payments
    description: "Shopper-facing payment rails, returns and sandbox pages."
  - name: admin
    description: "Admin server functions (no stable REST transport — see x-undocumented)."
paths:
  /api/public/oauth/token:
    x-source-file: src/routes/api/public/oauth/token.ts
    options:
      operationId: oauthTokenCors
      summary: "CORS preflight for the token endpoint"
      tags:
        - oauth
      responses:
        "204":
          description: "Preflight accepted, no body."
    post:
      operationId: oauthIssueToken
      summary: "Issue or refresh an OAuth 2.1 token pair (PKCE required for authorization_code)"
      tags:
        - oauth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: "Token pair issued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: "unsupported_grant_type or other OAuth request error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: "invalid_client (missing or unknown credentials; never reveals which)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: "server_error, no internals leaked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /api/public/oauth/revoke:
    x-source-file: src/routes/api/public/oauth/revoke.ts
    options:
      operationId: oauthRevokeCors
      summary: "CORS preflight for the revocation endpoint"
      tags:
        - oauth
      responses:
        "204":
          description: "Preflight accepted, no body."
    post:
      operationId: oauthRevokeToken
      summary: "Revoke a token (RFC 7009; always 200 so tokens cannot be probed)"
      tags:
        - oauth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: "Accepted (also for unknown or missing tokens)."
  /api/public/v1/me:
    x-source-file: src/routes/api/public/v1/$.ts
    get:
      operationId: v1GetMe
      summary: "Identity of the calling credential"
      tags:
