# Framique CI — CircleCI is the ONLY CI system. Do not add GitHub Actions
# (see AGENTS.md "CI" section). This pipeline mirrors `.github/workflows`
# tooling choices verified against current CircleCI docs via Context7:
# - `circleci/node` orb provides first-class Bun support (`install-bun`,
#   `install-packages` with `pkg-manager: bun`, frozen-lockfile installs
#   that honour the bunfig.toml 24h supply-chain guard).
# - No `cimg/bun` image exists — Bun is installed onto `cimg/node`.
# - E2E uses the `-browsers` image variant + Playwright's own browser
#   install (`--with-deps` needs the apt access convenience images provide).
version: 2.1

orbs:
  node: circleci/node@7.2

executors:
  bun-executor:
    docker:
      - image: cimg/node:24.21
    resource_class: medium
  e2e-executor:
    docker:
      - image: cimg/node:24.21-browsers
    resource_class: large
    # No executor-wide environment. The hermetic browser-boot env lives on
    # the three spec-run steps that actually spawn the dev server. An
    # executor-wide copy also fed the headless release gates, and
    # schema:check treats "credentials present" as "drift-check the live
    # schema" — so the fake boot values failed e2e-levelb-production at the
    # release gates before Playwright ever ran (first remote run). The values
    # are deliberately fake and unreachable (reserved 127.0.0.1:9 discard
    # port) — never secrets, never a placeholder host that could resolve.

commands:
  setup-bun:
    description: Install pinned Bun and project dependencies (frozen lockfile).
    steps:
      - node/install:
          install-bun: true
          bun-version: "1.3.14"
      - node/install-packages:
          pkg-manager: bun
          app-dir: ~/project

jobs:
  lint-typecheck:
    executor: bun-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: ESLint
          command: bun run lint
      - run:
          name: Typecheck (tsgo --noEmit)
          command: bun run typecheck
      - run:
          name: Ops shell scripts (bash -n)
          command: |
            shopt -s nullglob
            for f in ops/backup/*.sh; do bash -n "$f"; done
            echo "syntax OK"
      - run:
          name: Harness registry (schema check, no execution)
          command: node harness/run.mjs --list > /dev/null

  unit-contract:
    executor: bun-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: Unit + contract tests (Vitest)
          command: bun run test
      - run:
          name: Contract gate
          command: bun run test:contracts

  scan:
    parameters:
      sast-mode:
        description: "diff scans changed code vs the PR-aware base (fail-closed); full scans the whole tree (nightly sweep)."
        type: enum
        enum: ["diff", "full"]
        default: "diff"
    executor: bun-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: Secret scan (blocking)
          command: bun run secrets:scan
      - run:
          name: SAST suspicious-diff (blocking)
          command: |
            if [ "<< parameters.sast-mode >>" = "full" ]; then
              # Scheduled whole-tree sweep (nightly-full-sast workflow): the
              # full tree is the target set, so no base ref is needed.
              node scripts/sast-scan.mjs --full
              # Preserve the scanner's exit code; never fall through to diff mode.
              exit "$?"
            fi
            # Fail-closed base resolution — first hit wins:
            #   1. SAST_BASE when explicitly set (manual override / project env;
            #      must name a ref fetchable below, e.g. origin/main).
            #   2. Fork-PR context (CIRCLE_PR_NUMBER): destination branch via
            #      the GitHub API when a token is available (best effort —
            #      any failure falls through to the branch default below).
            #   3. Branch-aware default: builds on `frame30` (the integration
            #      branch) diff against origin/main; any other branch diffs
            #      against origin/frame30 when it exists (PRs target it),
            #      else origin/main. CircleCI exposes the source branch as
            #      CIRCLE_BRANCH but never the PR destination, hence this chain.
            # Every fetch below is fatal by design: if the base
            # cannot be fetched the job fails here. The scanner then runs with
            # SAST_REQUIRE_BASE=1, so an unresolvable base can never pass
            # vacuously — base established + zero changed lines stays a
            # genuine pass (e.g. post-merge builds on main).
            set -eu
            # CircleCI checks out a depth-1 clone, which has no history for
            # the range diff to anchor on: `git diff origin/<base>...HEAD`
            # dies with "no merge base", and SAST_REQUIRE_BASE=1 rightly
            # treats that as fatal (the first remote run of this job failed
            # exactly there). Complete the local history before resolving
            # the base. The fetch is fatal-by-design: an incompletable
            # history fails the job right here — never a silent narrowing of
            # the scan. (frame30 sits 133 commits ahead of main; the branch
            # checkout itself is depth-1, so HEAD's ancestry is the missing
            # side.)
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              UNSHALLOW_REF="${CIRCLE_BRANCH:-}"
              if [ -z "$UNSHALLOW_REF" ]; then
                UNSHALLOW_REF="$(git branch --show-current 2>/dev/null || true)"
              fi
              if [ -n "$UNSHALLOW_REF" ]; then
                git fetch --unshallow origin "$UNSHALLOW_REF"
              else
                git fetch --unshallow origin
              fi
            fi
            BASE="${SAST_BASE:-}"
            TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-}}"
            if [ -z "$BASE" ] && [ -n "${CIRCLE_PR_NUMBER:-}" ] && [ -n "$TOKEN" ]; then
              SLUG="$(git config --get remote.origin.url | sed -E -e 's#\.git$##' -e 's#.*github\.com[:/]([^/]+)/([^/]+)$#\1/\2#')"
              if PR_BASE="$(curl -fsSL -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$SLUG/pulls/$CIRCLE_PR_NUMBER" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).base.ref))" 2>/dev/null)"; then
                if [ -n "$PR_BASE" ]; then
                  git fetch origin "$PR_BASE:refs/remotes/origin/$PR_BASE" --depth 50
                  BASE="origin/$PR_BASE"
                  echo "SAST: base $BASE (PR #$CIRCLE_PR_NUMBER destination via API)"
                fi
              else
                echo "SAST: PR-destination lookup failed; falling back to branch default"
              fi
            fi
            if [ -z "$BASE" ]; then
              CUR="${CIRCLE_BRANCH:-}"
              if [ -z "$CUR" ]; then
                if TRY="$(git branch --show-current 2>/dev/null)"; then
                  CUR="$TRY"
                else
                  CUR=""
                fi
              fi
              CANDIDATE="main"
              if [ -n "$CUR" ] && [ "$CUR" != "main" ] && [ "$CUR" != "master" ] && [ "$CUR" != "frame30" ]; then
                if git ls-remote --exit-code --heads origin frame30 >/dev/null 2>&1; then
                  CANDIDATE="frame30"
                fi
              fi
              git fetch origin "$CANDIDATE:refs/remotes/origin/$CANDIDATE" --depth 50
              BASE="origin/$CANDIDATE"
              echo "SAST: base $BASE (branch default for '${CUR:-unknown}')"
            else
              case "$BASE" in
                origin/*)
                  git fetch origin "${BASE#origin/}:refs/remotes/$BASE" --depth 50
                  ;;
              esac
              echo "SAST: base $BASE (explicit SAST_BASE)"
            fi
            export SAST_BASE="$BASE"
            SAST_REQUIRE_BASE=1 bun run sast:scan
      - run:
          name: Dependency audit (blocking, reviewed exceptions only)
          command: bun run scan:deps
      - run:
          name: Attribution report (observability, non-blocking)
          command: |
            # NOT a gate: `|| true` is correct here because this step only
            # assembles review context (SAST finding -> introducing commit ->
            # PR actor/reviewers + package-report rows). A broken or empty
            # assembly must never fail the build; the secret/SAST/dep gates
            # above stay fail-closed. The artifact always exists afterwards
            # (fallback stub) so store_artifacts never misses its path.
            mkdir -p .artifacts
            node scripts/attribution-report.mjs --out .artifacts/attribution.json || true
            test -f .artifacts/attribution.json || printf '{"generatedAt":"%s","unresolved":"attribution-report did not emit"}\n' "$(date -u +%FT%TZ)" > .artifacts/attribution.json
      - store_artifacts:
          path: .artifacts/attribution.json

  build:
    executor: bun-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: Production build (Vite + Nitro)
          command: bun run build

  e2e-critical:
    executor: e2e-executor
    steps:
      - checkout
      - setup-bun
      # Fail-closed: a missing Playwright harness must NOT read as a pass.
      # `e2e:required` exits non-zero (writing a HARNESS-MISSING-NOT-VERIFIED
      # marker) until `.e2e/playwright.config.ts` lands; only then do the
      # browser install and the critical suites run. See
      # docs/security/ci-gates.md. (This intentionally supersedes the old
      # pass-by-design skip described in AGENTS.md.)
      - run:
          name: E2E harness required (fail-closed)
          command: bun run e2e:required
      - run:
          name: Install Playwright Chromium
          command: bunx playwright install --with-deps chromium
      # Browser-boot env for the Playwright-managed dev server ONLY:
      # assertBootEnv (src/server.ts) refuses to start without Supabase
      # names; every spec here is loopback-only and never reaches a backend.
      # Deliberately fake, unreachable (reserved 127.0.0.1:9) — see the
      # executor comment for why this is scoped to the step.
      - run:
          name: E2E critical suites
          command: bun run e2e:critical
          environment:
            SUPABASE_URL: "http://127.0.0.1:9"
            SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
            SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"
            VITE_SUPABASE_URL: "http://127.0.0.1:9"
            VITE_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"
            AUTH_HASH_SALT: "ci-placeholder-salt"

  plugin-storefront-gate:
    executor: bun-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: Plugin + storefront tripwire (blocking)
          command: |
            bun run test -- \
              src/components/store/PluginLayer.test.tsx \
              src/components/store/ThemeChrome.plugins.test.tsx \
              src/components/store/PluginFooterMounts.test.tsx \
              src/components/store/StudioNodes.plugins.test.tsx \
              src/lib/builtin-whatsapp.test.ts \
              src/lib/plugin-acceptance.test.ts \
              src/lib/phase5-plugins.test.ts

  # Adversarial browser specs: every file named here EXISTS and passes cold.
  # (The aspirational *_loop suites have docs but no Playwright implementation;
  # `e2e:critical`/`e2e:golden` were rewired to runnable specs for the same
  # reason — see package.json.) Do not add a spec here until it
  # passes from cold locally.
  e2e-security:
    executor: e2e-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: E2E harness required (fail-closed)
          command: bun run e2e:required
      - run:
          name: Install Playwright Chromium
          command: bunx playwright install --with-deps chromium
      # Browser-boot env scoped exactly like e2e-critical (Playwright webServer).
      - run:
          name: E2E adversarial security specs
          command: bun run e2e:security
          environment:
            SUPABASE_URL: "http://127.0.0.1:9"
            SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
            SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"
            VITE_SUPABASE_URL: "http://127.0.0.1:9"
            VITE_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"
            AUTH_HASH_SALT: "ci-placeholder-salt"

  # Level B genuine-bundle production E2E (harness `levelb-production-e2e`).
  # Runs EXACTLY the harness verifier command — `npx playwright test -c
  # .e2e/playwright.config.ts levelb-theme-execution levelb-theme-switch-serve
  # levelb-theme-lifecycle` — so genuine execution (real fixture theme: repo
  # gsap/ScrollTrigger plus three, hash-asserted /t serving, GSAP end state,
  # ScrollTrigger progress, real WebGL draw in-frame, zero theme code on the
  # host, plus the install-to-serve switch round-trip) is proven by EXECUTION
  # in CI, not by file-words in a unit test. Every spec named here EXISTS and
  # passes cold (`.e2e/levelb-theme-sandbox.spec.ts` exists but is NOT in the
  # harness verifier set — do not add it here until the harness task adopts
  # it). Same executor/steps as e2e-critical/e2e-security: browsers image +
  # large class (real Chromium), fail-closed harness gate first.
  e2e-levelb-production:
    executor: e2e-executor
    steps:
      - checkout
      - setup-bun
      - run:
          name: E2E harness required (fail-closed)
          command: bun run e2e:required
      - run:
          name: Install Playwright Chromium
          command: bunx playwright install --with-deps chromium
      # Headless release gates (static: no credentials, no GPU, no server).
      # - schema:check passes vacuously without SUPABASE creds (the script
      #   skips with exit 0); WITH creds it drift-checks the live schema —
      #   hence the browser-boot env below is scoped to the spec step only,
      #   never to this step or the executor.
      # - cron:check is a pure file compare (registry vs ops/cron/crontab).
      # - selfhost:preflight static half runs anywhere (YAML/shape checks);
      #   host-secret checks SKIP without --host by design.
      # - seo:weight is a static source scan (no browser, no network).
      - run:
          name: Release gates (headless)
          command: |
            bun run schema:check
            bun run cron:check
            bun run selfhost:preflight
            bun run seo:weight
      # NOT wired here (needs credentials/GPU/seeded server — owner runs
      # pre-release via package.json `gates:release`):
      # - db:migrate:check needs DATABASE_URL or the compose db container
      #   (docker exec); neither exists on these executors.
      # - perf:budget needs the `dist/` Vite manifest from `bun run build`,
      #   which this pipeline does not persist across jobs (no workspaces).
      # - a11y/vitals/responsive/console/rhythm/design gates need a seeded
      #   running server plus long browser runtimes beyond this job's scope.
      # - e2e:browsers (browser-smoke) needs E2E_STORE_SLUG on a seeded store
      #   AND firefox+webkit installs (multi-engine cost).
      # Browser-boot env for the Playwright-managed dev server ONLY (same
      # scoping as e2e-critical/e2e-security): assertBootEnv refuses to boot
      # without Supabase names; the specs are loopback-only. Deliberately
      # fake, unreachable (reserved 127.0.0.1:9).
      - run:
          name: Level B production E2E (harness verifier, exact command)
          command: npx playwright test -c .e2e/playwright.config.ts levelb-theme-execution levelb-theme-switch-serve levelb-theme-lifecycle
          environment:
            SUPABASE_URL: "http://127.0.0.1:9"
            SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
            SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"
            VITE_SUPABASE_URL: "http://127.0.0.1:9"
            VITE_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"
            AUTH_HASH_SALT: "ci-placeholder-salt"

workflows:
  version: 2
  gates:
    jobs:
      - lint-typecheck
      - unit-contract
      - scan
      - build
      # build is a HARD gate: e2e-critical never starts unless the production
      # build succeeds. Without this `requires` edge every job fans out in
      # parallel, so a broken build still burns the large browsers executor on
      # E2E while its own red signal races the other jobs. A failed `build`
      # now fails the workflow with e2e-critical left `blocked` (never run).
      - e2e-critical:
          requires:
            - build
      # Same hard gate as e2e-critical: never burn the browsers executor
      # when the production build is broken.
      - e2e-security:
          requires:
            - build
      # Same hard gate: the harness `levelb-production-e2e` verifier (exact
      # command) plus the headless release gates run only on a green build.
      # Credential/GPU-gated release steps stay owner-run pre-release (see
      # the NOT-wired comment on the job). No approval hold anywhere in this
      # pipeline (mirrors e2e-critical/e2e-security: requires build only).
      - e2e-levelb-production:
          requires:
            - build
      - plugin-storefront-gate
  # Nightly whole-tree SAST sweep: catches anything that landed outside a
  # scanned diff (long-lived branches, suppression drift). Covers main plus
  # frame30 while the integration branch lives; drop it when retired.
  nightly-full-sast:
    triggers:
      - schedule:
          cron: "0 4 * * *"
          filters:
            branches:
              only:
                - main
                - frame30
    jobs:
      - scan:
          sast-mode: full
