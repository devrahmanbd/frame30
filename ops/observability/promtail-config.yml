# Promtail — ships container stdout to Loki.
#
# The app writes PII-scrubbed JSON lines (`src/lib/observability.server.ts`
# -> `log()`), each stamped with `trace_id` / `span_id`, so a Grafana log line
# links straight to its Sentry trace via the datasource's derived field.
#
# Label discipline: labels are for *streams* (service, env, level), never for
# high-cardinality values (merchant_id, order_id, trace_id). Those stay in the
# line body and are extracted at query time with `| json`.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    external_labels:
      env: ${DEPLOY_ENV:-production}
      host: ${HOSTNAME}

scrape_configs:
  # ---------------------------------------------------------------- docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: stack
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Docker wraps every line: {"log":"...","stream":"stdout","time":"..."}
      - docker: {}

      # App lines are JSON; anything else (Postgres, Redis, nginx) falls
      # through untouched so a malformed line is never dropped silently.
      - match:
          selector: '{service=~"app|worker|payments"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  event: event
                  trace_id: trace_id
                  span_id: span_id
                  merchant_id: merchant_id
                  status: status
                  duration_ms: duration_ms
                  ts: ts
            - timestamp:
                source: ts
                format: RFC3339Nano
                action_on_failure: fudge
            # Only bounded values become labels.
            - labels:
                level:
                event:
            # trace_id / span_id ride as structured metadata: queryable and
            # link-able without exploding the stream count.
            - structured_metadata:
                trace_id:
                span_id:
            - metrics:
                framique_log_lines_total:
                  type: Counter
                  description: Log lines ingested by level
                  source: level
                  config:
                    action: inc

      # Postgres (self-hosted Supabase) — severity is the only useful label.
      - match:
          selector: '{service=~"db|supabase-db|postgres"}'
          stages:
            - regex:
                expression: '(?P<severity>DEBUG|INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC):'
            - labels:
                severity:

      # Drop health-check noise before it costs storage.
      - drop:
          expression: '(GET /-/healthy|GET /api/public/health|kube-probe)'
          drop_counter_reason: healthcheck

  # ------------------------------------------------------------- host logs
  - job_name: host-syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          service: host
          __path__: /var/log/{syslog,messages,auth.log}
