# Loki — single-binary, filesystem-backed. Sized for one BD node; swap
# `storage_config` to S3/MinIO when logs outgrow local disk. Nothing else in
# the stack changes when you do: Promtail pushes to the same URL and Grafana
# queries the same datasource.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # App logs are JSON lines with bounded labels (see promtail-config.yml).
  # Cardinality discipline lives in the pipeline, so these caps are guardrails,
  # not the design.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_label_names_per_series: 20
  max_query_series: 2000
  max_query_parallelism: 16
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 720h        # 30 days, matches Prometheus retention
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

ruler:
  # Log-based alerts (e.g. a burst of `level=error`) are evaluated here and
  # handed to the same Alertmanager as metric alerts — one on-call surface.
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
