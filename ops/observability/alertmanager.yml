# Alertmanager routing. Prometheus references an alertmanager at
# alertmanager:9093; this is the receiver config it needs, or every alert fires
# into a void.
#
# Severity contract:
#   severity=page   -> PagerDuty (wakes a human, 24/7)
#   severity=ticket -> Slack #framique-ops (business hours)
#   severity=info   -> Slack only, grouped hourly
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: slack-ops
  group_by: [alertname, team, slo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: pagerduty-primary
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - matchers: [severity="page"]
      receiver: slack-ops

    - matchers: [team="security"]
      receiver: slack-security
      repeat_interval: 2h

    - matchers: [severity="info"]
      receiver: slack-ops
      group_interval: 1h
      repeat_interval: 24h

inhibit_rules:
  # A dark scrape target explains every downstream freshness alert — don't
  # page twice for one cause.
  - source_matchers: [alertname="MetricsEndpointDown"]
    target_matchers: [severity=~"page|ticket"]
    equal: [team]

  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [alertname, team]

receivers:
  - name: pagerduty-primary
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook }}'
          slo: '{{ .CommonLabels.slo }}'
          firing: '{{ .Alerts.Firing | len }}'

  - name: slack-ops
    slack_configs:
      - channel: '#framique-ops'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ .CommonAnnotations.summary }}
          {{ if .CommonAnnotations.runbook }}Runbook: {{ .CommonAnnotations.runbook }}{{ end }}

  - name: slack-security
    slack_configs:
      - channel: '#framique-security'
        send_resolved: true
        title: '[SECURITY] {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
