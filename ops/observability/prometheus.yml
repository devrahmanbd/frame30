# Prometheus scrape configuration for Framique — self-hosted.
#
# Everything below runs on our own infrastructure and resolves by container
# name on the shared `framique` docker network. The app exposes a single
# authenticated exposition endpoint. Because the app runs as an autoscaled
# fleet of short-lived isolates, every counter is per-isolate and monotonic
# only within that isolate — always aggregate with sum(rate(...)) across
# instances, never read a raw counter value.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: framique
    env: production
    cluster: bd-primary

rule_files:
  - alerts.rules.yml
  - slo.rules.yml
  - infra.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ------------------------------------------------------------------ app
  - job_name: framique-app
    metrics_path: /api/public/metrics
    scheme: http
    # METRICS_TOKEN from the app environment. Without it the endpoint 404s.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/framique_metrics_token
    static_configs:
      - targets: ["app:3000"]
        labels:
          deployment: production
      - targets: ["framique-blue:3000"]
        labels:
          deployment: blue-green
          slot: blue
      - targets: ["framique-green:3000"]
        labels:
          deployment: blue-green
          slot: green
      - targets: ["app-preview:3000"]
        labels:
          deployment: preview

  # ----------------------------------------------------------- edge router
  - job_name: openresty-edge
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["edge-router:80"]
        labels:
          service: openresty-edge
          component: edge-router

  # -------------------------------------------------------- self-hosted deps
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    # Self-hosted Supabase Postgres, scraped through a read-only role.
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: supabase-services
    # Kong/PostgREST/GoTrue/Realtime/Storage expose their own metrics in the
    # self-hosted distribution; the ones that don't simply drop out of the
    # target list rather than failing the whole job.
    metrics_path: /metrics
    static_configs:
      - targets:
          - "supabase-kong:8100"
          - "supabase-rest:3001"
          - "supabase-auth:9999"
          - "supabase-realtime:9100"
          - "supabase-storage:5000"

  # ------------------------------------------------------- the stack itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # ------------------------------------------------------- synthetic probes
  # Black-box view: what a shopper in Dhaka actually gets, independent of
  # whether the app thinks it is healthy.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://framique.com/
          - https://framique.com/pricing
          - https://framique.com/api/public/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
