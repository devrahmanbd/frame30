apiVersion: 1

# Grafana provisioning: drop this folder into /etc/grafana/provisioning and the
# datasources plus dashboards come up with the stack — no click-ops, no drift.
# Every backend is self-hosted and addressed by container name on the shared
# `framique` docker network.
datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST
      manageAlerts: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: Loki

  - name: Loki
    type: loki
    uid: Loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 2000
      # App logs are JSON lines carrying trace_id, so a log links to its trace
      # in our *self-hosted* Sentry (SENTRY_WEB_URL / SENTRY_ORG are injected
      # by docker-compose.observability.yml).
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: '${SENTRY_WEB_URL}/organizations/${SENTRY_ORG}/performance/trace/$${__value.raw}/'
          urlDisplayLabel: 'Open trace in Sentry'

  - name: Alertmanager
    type: alertmanager
    uid: Alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
