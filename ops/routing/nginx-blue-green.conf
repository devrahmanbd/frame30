user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # Keep-Alive & Connection Pooling
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Logging Format with Latency & Tenant Canary Tracking
    log_format framique_upstream '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 'rt=$request_time uct="$upstream_connect_time" '
                                 'uht="$upstream_header_time" urt="$upstream_response_time" '
                                 'slot="$upstream_addr" cohort="$http_x_framique_cohort_tier" '
                                 'target="$selected_backend" host="$host"';

    access_log /var/log/nginx/access.log framique_upstream;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype image/svg+xml;

    # --------------------------------------------------------------------------
    # OpenResty + lua-resty-acme (https://github.com/fffonion/lua-resty-acme)
    # Automated Let's Encrypt TLS Certificate Lifecycle & Dynamic SNI Dispatch
    # --------------------------------------------------------------------------
    lua_shared_dict acme 16m;
    lua_shared_dict autossl_events 128k;

    # Resolver for Docker internal DNS and public DNS-over-UDP
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    init_by_lua_block {
        local autossl = require("resty.acme.autossl")
        autossl.init({
            tos_accepted = true,
            account_email = os.getenv("ACME_ACCOUNT_EMAIL") or "ops@framique.com",
            staging = os.getenv("ACME_STAGING") == "true",
            storage_adapter = "file",
            storage_config = {
                dir = "/var/lib/openresty/acme",
            },
            domain_whitelist_callback = function(domain, is_new_cert_needed)
                if not domain or #domain < 3 or #domain > 253 then
                    return false
                end
                -- Platform root domains and wildcards are always approved
                if domain == "framique.com" or domain == "edge.framique.app" or domain == "localhost" then
                    return true
                end
                if ngx.re.match(domain, [[\.(framique\.app|framique\.com|store\.framique\.com)$]], "jo") then
                    return true
                end

                -- Dynamic verification for custom merchant domains:
                -- When a new certificate is needed, verify the hostname exists in Framique
                if is_new_cert_needed then
                    local http = require("resty.http")
                    local httpc = http.new()
                    httpc:set_timeout(3000)
                    local verify_url = "http://127.0.0.1:3000/api/public/domains/verify-sni?host=" .. ngx.escape_uri(domain)
                    local res, err = httpc:request_uri(verify_url, {
                        method = "GET",
                        headers = {
                            ["Host"] = "framique.internal",
                            ["X-Framique-Edge-Secret"] = os.getenv("DOMAIN_EDGE_TOKEN") or "",
                        },
                    })
                    if res and res.status == 200 then
                        return true
                    end
                    -- If port 3000 is not on 127.0.0.1 (in docker-compose mesh), try upstream target
                    local mesh_url = "http://framique-blue:3000/api/public/domains/verify-sni?host=" .. ngx.escape_uri(domain)
                    local mres, merr = httpc:request_uri(mesh_url, {
                        method = "GET",
                        headers = {
                            ["Host"] = "framique.internal",
                            ["X-Framique-Edge-Secret"] = os.getenv("DOMAIN_EDGE_TOKEN") or "",
                        },
                    })
                    if mres and mres.status == 200 then
                        return true
                    end
                    return false
                end

                return true
            end,
        })
    }

    init_worker_by_lua_block {
        require("resty.acme.autossl").init_worker()
    }

    # Upstream Definitions (Hot-Reloadable)
    include /etc/nginx/conf.d/upstream.conf;
    include /etc/nginx/conf.d/canary-weights.conf;

    # Upstream Targets for Direct Cohort Routing (Phase 7.2)
    upstream framique_target_blue {
        server framique-blue:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream framique_target_green {
        server framique-green:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Map edge header X-Framique-Target-Slot to target upstream (Phase 7.2)
    map $http_x_framique_target_slot $selected_backend {
        "green" "framique_target_green";
        "blue"  "framique_target_blue";
        default "framique_canary_backend";
    }

    # --------------------------------------------------------------------------
    # Plain HTTP Server (Port 80): ACME Challenges, Healthcheck & Proxy
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Edge Router Healthcheck
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "edge-router-ok\n";
        }

        # Let's Encrypt HTTP-01 Challenge Endpoint (Automated by lua-resty-acme)
        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                require("resty.acme.autossl").serve_http_challenge()
            }
        }

        # Reverse Proxy to Active Blue/Green Cluster & Canary Targets
        location / {
            proxy_pass http://$selected_backend;
            proxy_http_version 1.1;

            # Clear Connection header to enable upstream keepalive
            proxy_set_header Connection "";

            # Client metadata headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Forward tenant & canary cohort context
            proxy_set_header X-Framique-Cohort-Tier $http_x_framique_cohort_tier;
            proxy_set_header X-Framique-Target-Slot $http_x_framique_target_slot;

            # Zero-Downtime Retries on Staged Release
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443): Dynamic SNI SSL Termination via lua-resty-acme
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # Bootstrap fallback certificate and key
        ssl_certificate /etc/openresty/ssl/default.pem;
        ssl_certificate_key /etc/openresty/ssl/default.key;

        # Dynamic SNI Certificate dispatch (lua-resty-acme auto-issuance & renewal)
        ssl_certificate_by_lua_block {
            require("resty.acme.autossl").ssl_certificate()
        }

        # Hardened TLS Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ACME challenge over TLS if requested
        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                require("resty.acme.autossl").serve_http_challenge()
            }
        }

        # Edge Router Healthcheck
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "edge-router-ok\n";
        }

        # Reverse Proxy to Active Blue/Green Cluster & Canary Targets
        location / {
            proxy_pass http://$selected_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header X-Framique-Cohort-Tier $http_x_framique_cohort_tier;
            proxy_set_header X-Framique-Target-Slot $http_x_framique_target_slot;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }
    }
}
