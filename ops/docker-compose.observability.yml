# Framique — self-hosted observability stack.
#
# Everything here runs on our own infrastructure: no SaaS, no vendor lock-in.
# The stack is the *operational* half of the platform; the *application* half
# (app + self-hosted Supabase + Redis) runs in `docker-compose.platform.yml`
# and joins the same `framique` network so scraping and log shipping work by
# container name.
#
#   metrics  : app /api/public/metrics  -> Prometheus -> Grafana
#   logs     : container stdout (JSON)  -> Promtail   -> Loki -> Grafana
#   errors   : app Sentry transport     -> self-hosted Sentry (see ops/sentry/)
#   alerts   : Prometheus rules         -> Alertmanager -> Slack / PagerDuty
#
# Usage:
#   cp ops/.env.example ops/.env && edit
#   docker compose --env-file ops/.env -f ops/docker-compose.observability.yml up -d
#
# Retention defaults are sized for a single-node BD deployment (30d metrics,
# 30d logs). Raise `--storage.tsdb.retention.time` and the Loki limits together
# — a metric without its log line is half a postmortem.

name: framique-observability

networks:
  framique:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle          # POST /-/reload after a config change
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    volumes:
      - ./observability:/etc/prometheus:ro
      - ./secrets/framique_metrics_token:/etc/prometheus/framique_metrics_token:ro
      - prometheus-data:/prometheus
    networks: [framique]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/alertmanager-templates:/etc/alertmanager/templates:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    networks: [framique]
    ports: ["127.0.0.1:9093:9093"]

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [framique]
    ports: ["127.0.0.1:3100:3100"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 10

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Container stdout/stderr + the Docker metadata Promtail relabels from.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    networks: [framique]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: ${GRAFANA_EXTERNAL_URL:-http://localhost:3001}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Datasource provisioning reads these (see provisioning-datasources.yml).
      SENTRY_WEB_URL: ${SENTRY_WEB_URL:-http://localhost:9000}
      SENTRY_ORG: ${SENTRY_ORG:-framique}
    volumes:
      - ./observability/grafana/provisioning-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/provisioning-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana:/etc/grafana/dashboards:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    networks: [framique]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, loki]

  # ---- exporters: the self-hosted dependencies must be observable too -----

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [framique]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [framique]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [framique]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      # Self-hosted Supabase Postgres. Use a read-only monitoring role, never
      # the superuser: an exporter credential leak must not be a data breach.
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
      PG_EXPORTER_EXCLUDE_DATABASES: template0,template1
    networks: [framique]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [framique]
