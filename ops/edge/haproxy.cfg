# =============================================================================
# LIVE-SOURCED — /etc/haproxy/haproxy.cfg from bd-primary-1 (88.99.250.99),
# captured 2026-09-24. This is the production ingress truth.
#
# Rule: change live first (with a backup), then re-port here verbatim.
# Never commit certs, keys, or .env contents — paths only.
#
# Topology (live): :443 haproxy (static PEMs from /etc/haproxy/certs/)
#   → 127.0.0.1:4443 openresty  (primary; host process, Kong build)
#   → 127.0.0.1:4444 caddy      (backup; see Caddyfile)
# Known-host ACLs route to the protected backend; everything else
# (including merchant custom domains) falls to bk_openresty_all.
# Gap vs repo design: ops/routing/nginx-blue-green.conf describes an
# autossl edge that is NOT what terminates 443 today — that file is
# aspirational until the ingress migration lands.
# =============================================================================
global
    log stdout format raw local0
    maxconn 20000
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  3600s
    timeout http-request 10s
    timeout http-keep-alive 10s

frontend ft_https
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    mode http

    acl is_shield hdr(host) -i shield.ghostmaster.shop
    acl is_que hdr(host) -i que.qubickle.com
    acl is_supabase hdr(host) -i supabase.ghostmaster.shop supabase.qubickle.com
    acl is_framebase hdr(host) -i framebase.qubickle.com
    acl is_framique hdr(host) -i framique.qubickle.com

    use_backend bk_openresty_protected if is_shield or is_que or is_supabase or is_framebase or is_framique
    default_backend bk_openresty_all

backend bk_openresty_protected
    mode http
    http-request set-header X-Forwarded-Proto https
    balance roundrobin

    server openresty 127.0.0.1:4443 check inter 2s fall 2 rise 1
    server caddy 127.0.0.1:4444 check inter 5s fall 1 rise 1 backup

backend bk_openresty_all
    mode http
    server openresty 127.0.0.1:4443 check
