name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: unit + contract tests
        run: bun run test
      - name: contract gate
        run: bun run test:contracts
      - name: secret scan
        run: bun run scan:secrets
      - name: dependency audit (non-blocking)
        run: bun run scan:deps
        continue-on-error: true
