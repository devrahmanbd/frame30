name: e2e-seven-templates

# The seven-template editor journey, run on a THROWAWAY loopback stack.
#
# This is the GitHub Actions twin of the CircleCI `e2e-seven-templates` job:
# the same command (`scripts/e2e-seven-templates-ci.sh`), the same fail-closed
# contract. The script brings up its own E2E-only Supabase stack, generates
# every secret in-job, applies the sanctioned migration chain + fixtures and
# tears the stack down on success, failure and interruption. No production
# host, credential or database is ever referenced.
#
# `--retries=0 --workers=1` live inside the script: a red run here is a real
# red, never a retry mask.

on:
  push:
    branches: [main, frame30]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-seven-templates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seven-templates:
    name: seven-template editor journey
    runs-on: ubuntu-latest
    # Bring-up pulls the Supabase images on a cold runner and the lane itself
    # is ~5 minutes of browser work; 60 leaves room for both without letting a
    # wedged stack burn an hour of minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same Bun the rest of the pipeline uses. `bun install`
      # (not the node orb) is what the CircleCI job does on the machine
      # executor, and it is what `bun run build` inside the script expects.
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Fail closed: the script needs `docker compose` (v2) and a reachable
      # daemon. GitHub's ubuntu-latest runner already has both.
      - name: Docker Compose v2 present (fail-closed)
        run: docker compose version

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Seven-template lane (throwaway loopback stack)
        run: bash scripts/e2e-seven-templates-ci.sh
        timeout-minutes: 45

      # Evidence, always — including on failure, which is when it matters.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-seven-templates-report
          path: .artifacts/e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-seven-templates-test-results
          path: test-results
          if-no-files-found: ignore